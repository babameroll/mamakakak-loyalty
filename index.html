<!DOCTYPE html>
<html lang="en">
<head>

  <!-- PWA Manifest & App Icons -->
  <link rel="manifest" href="manifest.json?v=1">
  <meta name="theme-color" content="#6b4226">
  <meta name="mobile-web-app-capable" content="yes">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #6b4226; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>

  <!-- EMBED YOUR GOOGLE APPS SCRIPT WEB APP -->
  <iframe 
    src="https://script.google.com/macros/s/AKfycbyDNzQoW7EgdDi0yDKGmpK5rQ1A4cg0YExHG96teyD9M9n7wTqZqkWBW0-Rcwh0PUGfOw/exec"

    sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-modals"
  ></iframe>

  <script>
    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js?v=1')
          .then(reg => console.log('Loyalty PWA Registered!', reg))
          .catch(err => console.error('Service Worker Registration Failed:', err));
      });
